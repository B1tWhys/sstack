default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
fail_fast: true

repos:
  - repo: https://github.com/B1tWhys/no-emoji.git
    rev: "1.0"
    hooks:
      - id: no-emoji

  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        entry: cargo fmt --all --check
        language: system
        pass_filenames: false
        always_run: true

      - id: clippy
        name: clippy
        entry: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        language: system
        pass_filenames: false
        always_run: true

      - id: rustdoc
        name: rustdoc
        entry: cargo doc --workspace --all-features --no-deps --locked --config 'build.rustdocflags=["-Dwarnings"]'
        language: system
        pass_filenames: false
        always_run: true

      # Writes the coverage report the crap hook reads.
      - id: tests
        name: tests with coverage
        entry: cargo llvm-cov --workspace --all-features --locked --doctests --json --output-path target/coverage.json
        language: system
        pass_filenames: false
        always_run: true

      - id: crap
        name: CRAP score
        entry: cargo crap4rust --coverage target/coverage.json --threshold 6 --warn-threshold 6 --project-threshold 0 --strict
        language: system
        pass_filenames: false
        always_run: true

      - id: conventional-commit
        name: conventional commit message
        entry: committed --commit-file
        language: system
        stages: [commit-msg]
