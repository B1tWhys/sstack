default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
fail_fast: true

repos:
  - repo: https://github.com/B1tWhys/no-emoji.git
    rev: "1.0"
    hooks:
      # This hook rejects every non-ASCII character. Snapshots of the TUI hold the box-drawing
      # characters the screen is drawn with, so they are left out.
      - id: no-emoji
        exclude: \.snap$

  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        entry: cargo fmt --all --check
        language: system
        pass_filenames: false
        always_run: true

      - id: clippy
        name: clippy
        entry: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        language: system
        pass_filenames: false
        always_run: true

      - id: rustdoc
        name: rustdoc
        entry: cargo doc --workspace --all-features --no-deps --locked --config 'build.rustdocflags=["-Dwarnings"]'
        language: system
        pass_filenames: false
        always_run: true

      # Writes the coverage report the crap hook reads. Runs through nextest so that a hanging test
      # is stopped, which nextest cannot do for doctests, so they run separately.
      - id: tests
        name: tests with coverage
        entry: >-
          sh -c 'cargo llvm-cov clean --workspace
          && cargo llvm-cov --no-report nextest --workspace --all-features --locked
          && cargo llvm-cov --no-report --doc --workspace --all-features --locked
          && cargo llvm-cov report --doctests --json --output-path target/coverage.json'
        language: system
        pass_filenames: false
        always_run: true

      - id: crap
        name: CRAP score
        entry: cargo crap4rust --coverage target/coverage.json --threshold 6 --warn-threshold 6 --project-threshold 0 --strict
        language: system
        pass_filenames: false
        always_run: true

      - id: conventional-commit
        name: conventional commit message
        entry: committed --commit-file
        language: system
        stages: [commit-msg]
