[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_docs_in_private_items = "deny"

# Unoptimized, cosmic-text and swash take seconds to shape a long transcript, which stalls the GUI
# on each Session switch. A Rebuild makes a dev build, so dev builds optimize every dependency.
# The workspace's own crates stay at opt-level 0 and still build fast.
[profile.dev.package."*"]
opt-level = 3
