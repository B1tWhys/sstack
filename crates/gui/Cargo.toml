[package]
name = "sstack-gui"
version.workspace = true
edition.workspace = true

# The library has the docs, as a binary with the same name would overwrite them.
[[bin]]
name = "sstack-gui"
path = "src/main.rs"
doc = false

[features]
default = ["nvim-tests"]
# Runs the tests that need a real nvim. Turn off where nvim is not installed.
nvim-tests = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
iced = { version = "0.14", features = ["advanced", "tokio"] }
sstack = { path = "../core", default-features = false }

[dev-dependencies]
iced_test = "0.14"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
