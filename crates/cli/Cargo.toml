[package]
name = "sstack"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
dirs = "7"
sstack-core = { path = "../core" }
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal", "sync"] }
tokio-util = "0.7"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
