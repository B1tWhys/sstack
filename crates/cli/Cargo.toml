[package]
name = "sstack-cli"
version.workspace = true
edition.workspace = true

# The library has the docs, as a binary named like the sstack library would
# overwrite its docs.
[[bin]]
name = "sstack"
path = "src/main.rs"
doc = false

[features]
default = ["nvim-tests"]
# Runs the tests that need a real nvim. Turn off where nvim is not installed.
nvim-tests = []

[dependencies]
anstyle = "1"
anstyle-lossy = "1"
anyhow = "1"
async-trait = "0.1"
bon = "3"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
sstack = { path = "../core", default-features = false }
sstack-tools = { path = "../tools" }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync"] }
tokio-util = "0.7"
unicode-width = "0.2"

[dev-dependencies]
insta = { version = "1", features = ["filters"] }
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
