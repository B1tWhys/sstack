[package]
name = "sstack"
version.workspace = true
edition.workspace = true

[features]
default = ["nvim-tests"]
# Runs the tests that need a real nvim. Turn off where nvim is not installed.
nvim-tests = []
# Runs the Sandbox tests that need a real Podman, installed and running.
podman-tests = []

[dependencies]
async-trait = "0.1"
bon = "3"
dirs = "7"
dotenvy = "0.15"
futures = "0.3"
genai = "0.7"
home = "0.5"
ignore = "0.4"
keyring-core = "1"
nix = { version = "0.31.3", features = ["signal", "user"] }
regex = "1"
rmpv = { version = "1", features = ["with-serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
slug = "0.1.6"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = "0.7"
toml = "1"
unicode-width = "0.2"
yaml-rust2 = { version = "0.13", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
mockall = "0.15.0"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
